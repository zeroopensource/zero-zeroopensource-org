packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: set this to true or false
  msw: set this to true or false
  unrs-resolver: set this to true or false

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild
  - msw
  - prisma
  - protobufjs
  - sharp
  - unrs-resolver
